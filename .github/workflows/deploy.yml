# Baut die Website bei jedem Push auf main und veröffentlicht sie auf GitHub Pages.
# Voraussetzung (einmalig): Repo → Settings → Pages → Source: «GitHub Actions».
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt auch einen manuellen Start unter «Actions»

permissions:
  contents: read
  pages: write
  id-token: write

# nie zwei Veröffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Website bauen
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
